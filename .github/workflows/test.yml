name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Playwright is a peer dependency: install it, then prove the browser
      # launches before testing, so a missing Chrome cannot read as a pass.
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium && npx playwright --version
      - run: npm test
